name: update-formula

on:
  workflow_call:
    inputs:
      tag:
        description: "Published release tag"
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-formula:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve tag
        id: resolve
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # 显式输入优先，避免手动从默认分支执行时误用分支名。
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${EVENT_TAG:-}"
          fi
          if [ -z "$TAG" ]; then
            echo "tag is empty"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must use the stable version format vX.Y.Z"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # 发布和校验文件必须已存在，不轮询尚未完成的构建。
          gh api "repos/${REPO}/releases/tags/${TAG}" > "${RUNNER_TEMP}/goldbot-release.json"
          jq -e --arg tag "$TAG" '
            .tag_name == $tag and .draft == false and .prerelease == false
            and any(.assets[]; .name == "SHA256SUMS.txt" and .state == "uploaded")
          ' "${RUNNER_TEMP}/goldbot-release.json" > /dev/null || {
            echo "release must be published, stable, and include SHA256SUMS.txt"
            exit 1
          }

      - name: Download checksums
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          URL="https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS.txt"
          # 仅短暂重试超时、限流和服务器错误；404 直接失败。
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 10 --max-time 60 "$URL" -o SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Regenerate formula
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          LINUX_SHA="$(awk '/goldbot-v.*-linux-x86_64\.tar\.gz$/ {print $1}' SHA256SUMS.txt)"
          MAC_ARM_SHA="$(awk '/goldbot-v.*-macos-aarch64\.tar\.gz$/ {print $1}' SHA256SUMS.txt)"
          MAC_X86_SHA="$(awk '/goldbot-v.*-macos-x86_64\.tar\.gz$/ {print $1}' SHA256SUMS.txt)"
          if [ -z "$LINUX_SHA" ] || [ -z "$MAC_ARM_SHA" ] || [ -z "$MAC_X86_SHA" ]; then
            echo "missing one or more required checksums"
            cat SHA256SUMS.txt
            exit 1
          fi

          cat > Formula/goldbot.rb <<EOF
          class Goldbot < Formula
            desc "GoldBot TUI Automation Agent"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${REPO}/releases/download/${TAG}/goldbot-v${VERSION}-macos-aarch64.tar.gz"
                sha256 "${MAC_ARM_SHA}"
              else
                url "https://github.com/${REPO}/releases/download/${TAG}/goldbot-v${VERSION}-macos-x86_64.tar.gz"
                sha256 "${MAC_X86_SHA}"
              end
            end

            on_linux do
              url "https://github.com/${REPO}/releases/download/${TAG}/goldbot-v${VERSION}-linux-x86_64.tar.gz"
              sha256 "${LINUX_SHA}"
            end

            def install
              bin.install "goldbot"
            end

            test do
              assert_match "GoldBot", shell_output("#{bin}/goldbot --help")
            end
          end
          EOF

      - name: Commit formula update
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/goldbot.rb; then
            echo "formula unchanged, skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/goldbot.rb
          git commit -m "chore: update homebrew formula for ${TAG}"
          git pull --rebase origin "${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
